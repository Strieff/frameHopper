<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    %s

    <style>
        html, body, #plotDiv {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
<div id="plotDiv"></div>

<script>
    function updateChart(data, layout) {
        Plotly.react(
            'plotDiv',
            data,
            layout,
            {
                modeBarButtons: [[
                    'zoomIn2d',
                    'zoomOut2d',
                    'autoScale2d',
                    'hoverClosestCartesian',
                    'hoverCompareCartesian'
                ]],
                displaylogo: false
            }
        );
    }
</script>
</body>
</html>
